## This file is overridden on update
## Add your own exports and config to 'userconfig.yaml'

## Setup defaults
## ==============

## Use 115220 Baud as default DUT baud rate
{% set serial = namespace(baud=115200) %}

## Include user configuration
## ==========================

## External USB Ports of the Raspberry Pi 4
{% set usb = namespace(ports=[
        ('1',   'platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.1'),
        ('2',   'platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.2'),
        ('3',   'platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.3'),
        ('4',   'platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.4')]) %}

{% include 'userconfig.yaml' %}

## Setup resources
## ===============

## Set up USB ports after including user configuration to allow
## e.g. hub configuration
{% for idx, sysfs in usb.ports %}

rpi-usb-ports-p{{idx}}:
  AlteraUSBBlaster:
    match:
      'ID_PATH': '{{sysfs}}'
  AndroidUSBFastboot:
    match:
      'ID_PATH': '{{sysfs}}'
  DFUDevice:
    match:
      'ID_PATH': '{{sysfs}}'
  IMXUSBLoader:
    match:
      'ID_PATH': '{{sysfs}}'
  LXAUSBMux:
    match:
      '@ID_PATH': '{{sysfs}}'
  USBAudioInput:
    match:
      '@ID_PATH': '{{sysfs}}'
  USBDebugger:
    match:
      'ID_PATH': '{{sysfs}}'
  USBMassStorage:
    match:
      '@ID_PATH': '{{sysfs}}'
  USBSDMuxDevice:
    match:
      '@ID_PATH': '{{sysfs}}'
  USBSerialPort:
    match:
      '@ID_PATH': '{{sysfs}}'
  USBVideo:
    match:
      '@ID_PATH': '{{sysfs}}'

## Extra USB Ports exported as separate interfaces on the same USB port
{% for if in [ '1', '2', '3'] %}
rpi-usb-ports-p{{idx}}.{{if}}:
  USBSerialPort:
    match:
      '@ID_PATH': '{{sysfs}}:1.{{if}}'
{% endfor %}
{% endfor %}